      <circle cx="944" cy="488" r="2.4" fill="#8D620F" stroke="none" fill-opacity=".8"/>
    </g>
  
    <g>
      <rect x="444" y="522" width="20" height="20" rx="5" fill="none" stroke="#A9C6B8" stroke-opacity=".26"/>
      <circle cx="454" cy="532" r="2.2" fill="#A9C6B8" fill-opacity=".45" stroke="none"/>
      <rect x="478" y="525" width="150" height="5" rx="2.5" fill="#A9C6B8" stroke="none" fill-opacity=".32"/>
      <rect x="478" y="536" width="90" height="4" rx="2" fill="#A9C6B8" stroke="none" fill-opacity=".15"/>
      <rect x="854" y="522" width="110" height="20" rx="10" fill="#A9C6B8" fill-opacity=".03" stroke="#A9C6B8" stroke-opacity=".26"/>
