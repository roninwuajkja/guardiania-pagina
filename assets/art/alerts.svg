      <rect x="854" y="566" width="110" height="20" rx="10" fill="#A9C6B8" fill-opacity=".03" stroke="#A9C6B8" stroke-opacity=".16"/>
      <rect x="870" y="574" width="52" height="4" rx="2" fill="#A9C6B8" stroke="none" fill-opacity=".3"/>
      <circle cx="944" cy="576" r="2.4" fill="#A9C6B8" stroke="none" fill-opacity=".35"/>
    </g>

  <path d="M444 606H964" stroke="#A9C6B8" stroke-opacity=".12"/>
  <!-- siguiente paso -->
  <circle cx="452" cy="652" r="8" fill="none" stroke="#A9C6B8" stroke-opacity=".3"/>
  <circle cx="452" cy="652" r="2.6" fill="#A9C6B8" fill-opacity=".6" stroke="none"/>
