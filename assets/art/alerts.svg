  <rect width="1600" height="1200" fill="url(#a-grid-major)"/>
  <rect width="1600" height="1200" fill="url(#a-grid)"/>
  <rect width="1600" height="1200" fill="url(#a-vignette)"/>
  <circle cx="700" cy="530" r="520" fill="url(#a-halo)"/>
  <circle cx="700" cy="530" r="330" fill="url(#a-halo-warm)"/>
  <!-- traza de reglas -->
