  <rect x="472" y="656" width="86" height="4" rx="2" fill="#A9C6B8" stroke="none" fill-opacity=".14"/>
  <g fill="none" stroke="#EEF2ED" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M862 646v22h80"/>
    <path d="M934 660l8 8-8 8"/>
  </g>
  <g fill="none" stroke="#A9C6B8" stroke-opacity=".18">
    <path d="M850 634v46" stroke-dasharray="1 5"/>
  </g>

  <!-- marcas sueltas -->
  <g stroke="#A9C6B8" stroke-opacity=".18">
    <path d="M336 470h14M336 486h8M330 470v16"/>
    <path d="M1330 690h18M1330 706h10"/>
