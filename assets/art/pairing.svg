<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="pr-title">
  <title id="pr-title">IA Guardian — dos voluntades</title>
  <defs>
    <radialGradient id="pr-bg" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#0B241E"/>
      <stop offset="1" stop-color="#081B17"/>
    </radialGradient>
    <radialGradient id="pr-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5E8F7B" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#5E8F7B" stop-opacity=".06"/>
      <stop offset="1" stop-color="#5E8F7B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pr-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#A9C6B8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pr-glow-soft" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#A9C6B8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pr-vignette" cx="50%" cy="48%" r="72%">
      <stop offset=".52" stop-color="#081B17" stop-opacity="0"/>
      <stop offset="1" stop-color="#081B17" stop-opacity=".62"/>
    </radialGradient>
    <pattern id="pr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A9C6B8" stroke-width="1" opacity=".05"/>
    </pattern>
    <pattern id="pr-grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#A9C6B8" stroke-width="1" opacity=".055"/>
    </pattern>
    <pattern id="pr-dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="1.3" fill="#A9C6B8" opacity=".22"/>
    </pattern>
    <linearGradient id="pr-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123029"/>
      <stop offset="1" stop-color="#0B241E"/>
    </linearGradient>
    <linearGradient id="pr-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2ED" stop-opacity=".06"/>
      <stop offset=".45" stop-color="#EEF2ED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pr-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123029" stop-opacity=".5"/>
      <stop offset="1" stop-color="#081B17" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="pr-fade-x" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A9C6B8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </linearGradient>
    <filter id="pr-shadow" x="-45%" y="-45%" width="190%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="pr-shadow-lite" x="-45%" y="-45%" width="190%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    
    <radialGradient id="pr-band" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".09"/>
      <stop offset=".55" stop-color="#A9C6B8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo -->
  <rect width="1600" height="1200" fill="url(#pr-bg)"/>
  <rect width="1600" height="1200" fill="url(#pr-grid-major)"/>
  <rect width="1600" height="1200" fill="url(#pr-grid)"/>
  <rect width="1600" height="1200" fill="url(#pr-vignette)"/>
  <circle cx="800" cy="590" r="470" fill="url(#pr-halo)"/>
  <circle cx="800" cy="590" r="300" fill="url(#pr-halo)"/>
  <!-- columna de asentimiento -->
  <ellipse cx="800" cy="590" rx="196" ry="316" fill="url(#pr-band)"/>

