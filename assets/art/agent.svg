<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="ag-title">
  <title id="ag-title">IA Guardian — el agente</title>
  <defs>
    <radialGradient id="ag-bg" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#0B241E"/>
      <stop offset="1" stop-color="#081B17"/>
    </radialGradient>
    <radialGradient id="ag-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5E8F7B" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#5E8F7B" stop-opacity=".06"/>
      <stop offset="1" stop-color="#5E8F7B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#A9C6B8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag-glow-soft" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#A9C6B8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag-vignette" cx="50%" cy="48%" r="72%">
      <stop offset=".52" stop-color="#081B17" stop-opacity="0"/>
      <stop offset="1" stop-color="#081B17" stop-opacity=".62"/>
    </radialGradient>
    <pattern id="ag-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A9C6B8" stroke-width="1" opacity=".05"/>
    </pattern>
    <pattern id="ag-grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#A9C6B8" stroke-width="1" opacity=".055"/>
    </pattern>
    <pattern id="ag-dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="1.3" fill="#A9C6B8" opacity=".22"/>
    </pattern>
    <linearGradient id="ag-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123029"/>
      <stop offset="1" stop-color="#0B241E"/>
    </linearGradient>
    <linearGradient id="ag-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2ED" stop-opacity=".06"/>
      <stop offset=".45" stop-color="#EEF2ED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123029" stop-opacity=".5"/>
      <stop offset="1" stop-color="#081B17" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="ag-fade-x" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A9C6B8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </linearGradient>
    <filter id="ag-shadow" x="-45%" y="-45%" width="190%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="ag-shadow-lite" x="-45%" y="-45%" width="190%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    
    <linearGradient id="ag-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E8F7B" stop-opacity=".1"/>
      <stop offset="1" stop-color="#5E8F7B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="1600" height="1200" fill="url(#ag-bg)"/>
  <rect width="1600" height="1200" fill="url(#ag-grid-major)"/>
  <rect width="1600" height="1200" fill="url(#ag-grid)"/>
  <rect width="1600" height="1200" fill="url(#ag-vignette)"/>
  <circle cx="800" cy="560" r="480" fill="url(#ag-halo)"/>
  <circle cx="800" cy="596" r="300" fill="url(#ag-halo)"/>
  <!-- suelo -->
  <ellipse cx="800" cy="922" rx="250" ry="46" fill="url(#ag-floor)"/>
  <path d="M560 922H1040" stroke="#A9C6B8" stroke-opacity=".13"/>
  <g stroke="#A9C6B8" stroke-opacity=".12">
    <path d="M600 916v12M800 920v14M1000 916v12"/>
  </g>

  <!-- anillos de permisos -->
  <g fill="none">
    <circle cx="800" cy="596" r="196" stroke="#A9C6B8" stroke-opacity=".26" stroke-dasharray="1 8"/>
    <path d="M822.49 853.02A258 258 0 1 1 997.64 761.84" stroke="#A9C6B8" stroke-opacity=".36" stroke-width="1.5"/>
    <g stroke="#A9C6B8" stroke-opacity=".34"><path d="M757.28 838.26L753.11 861.9"/><path d="M568.84 511.86L546.28 503.65"/><path d="M923 382.96L935 362.17"/></g>
    <circle cx="800" cy="596" r="322" stroke="#A9C6B8" stroke-opacity=".15" stroke-dasharray="1 12"/>
    <g stroke="#A9C6B8" stroke-opacity=".1">
      <path d="M1130 596L1140 596"/><path d="M1118.76 681.41L1128.41 684"/><path d="M1085.79 761L1094.45 766"/><path d="M1033.35 829.35L1040.42 836.42"/><path d="M965 881.79L970 890.45"/><path d="M885.41 914.76L888 924.41"/><path d="M800 926L800 936"/><path d="M714.59 914.76L712 924.41"/><path d="M635 881.79L630 890.45"/><path d="M566.65 829.35L559.58 836.42"/><path d="M514.21 761L505.55 766"/><path d="M481.24 681.41L471.59 684"/><path d="M470 596L460 596"/><path d="M481.24 510.59L471.59 508"/><path d="M514.21 431L505.55 426"/><path d="M566.65 362.65L559.58 355.58"/><path d="M635 310.21L630 301.55"/><path d="M714.59 277.24L712 267.59"/><path d="M800 266L800 256"/><path d="M885.41 277.24L888 267.59"/><path d="M965 310.21L970 301.55"/><path d="M1033.35 362.65L1040.42 355.58"/><path d="M1085.79 431L1094.45 426"/><path d="M1118.76 510.59L1128.41 508"/>
    </g>
    <circle cx="800" cy="596" r="356" stroke="#A9C6B8" stroke-opacity=".07"/>
  </g>
  <!-- nodos de permiso -->
  <g>
    <circle cx="755.2" cy="850.08" r="4.4" fill="#5E8F7B" fill-opacity=".9" stroke="none"/>
        <circle cx="755.2" cy="850.08" r="11" fill="none" stroke="#A9C6B8" stroke-opacity=".28"/><circle cx="557.56" cy="507.76" r="4.4" fill="#5E8F7B" fill-opacity=".9" stroke="none"/>
        <circle cx="557.56" cy="507.76" r="11" fill="none" stroke="#A9C6B8" stroke-opacity=".28"/><circle cx="929" cy="372.57" r="4.4" fill="#5E8F7B" fill-opacity=".9" stroke="none"/>
        <circle cx="929" cy="372.57" r="11" fill="none" stroke="#A9C6B8" stroke-opacity=".28"/>
  </g>

  <!-- pulsos -->
  <g fill="none" stroke-linecap="round">
    <path d="M731.39 316.28A74 74 0 0 1 868.61 316.28" stroke="#A9C6B8" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M702.93 296.66A108 108 0 0 1 897.07 296.66" stroke="#A9C6B8" stroke-opacity=".32" stroke-width="1.5"/>
    <path d="M677.02 273A142 142 0 0 1 922.98 273" stroke="#A9C6B8" stroke-opacity=".18" stroke-width="1.5"/>
  </g>
  <circle cx="800" cy="270" r="3" fill="#EEF2ED" fill-opacity=".85" stroke="none"/>
  <g stroke="#A9C6B8" stroke-opacity=".2" stroke-dasharray="1 7" stroke-linecap="round">
    <path d="M744 300v-64M856 300v-40"/>
  </g>
  <g fill="#A9C6B8" stroke="none" fill-opacity=".45">
    <circle cx="744" cy="232" r="2.4"/><circle cx="856" cy="256" r="2.4"/>
  </g>

  <!-- teléfono -->
  <g filter="url(#ag-shadow)">
    <rect x="700" y="310" width="200" height="580" rx="32" fill="#123029" stroke="#A9C6B8" stroke-opacity=".52" stroke-width="2"/>
  </g>
  <rect x="709" y="319" width="182" height="562" rx="24" fill="#081B17" fill-opacity=".92" stroke="#A9C6B8" stroke-opacity=".1"/>
  <rect x="778" y="324" width="44" height="4" rx="2" fill="#A9C6B8" stroke="none" fill-opacity=".28"/>
  <rect x="780" y="862" width="40" height="3" rx="1.5" fill="#A9C6B8" stroke="none" fill-opacity=".2"/>
  <path d="M700 400h-5v44M900 400h5v44" stroke="#A9C6B8" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>

  <!-- candado -->
  <g>
    <circle cx="800" cy="607" r="120" fill="url(#ag-glow-soft)"/>
    <g fill="none" stroke="#A9C6B8" stroke-width="1">
      <path d="M837.86 661.06A66 66 0 0 1 737.98 584.43" stroke-opacity=".38"/>
      <path d="M762.14 552.94A66 66 0 0 1 862.02 629.57" stroke-opacity=".24"/>
    </g>
    <g>
      <path d="M780.76 593.07v-23.09a19.24 19.24 0 0 1 38.48 0V593.07" fill="none" stroke="#EEF2ED" stroke-opacity=".92" stroke-width="2" stroke-linecap="round"/>
      <rect x="763" y="586.14" width="74" height="57.72" rx="11.84" fill="#0B241E" fill-opacity=".94" stroke="#A9C6B8" stroke-opacity=".78" stroke-width="1.8"/>
      <rect x="768" y="591.14" width="64" height="47.72" rx="7.4" fill="none" stroke="#EEF2ED" stroke-opacity=".1"/>
      <circle cx="800" cy="605.76" r="4.29" fill="#EEF2ED" fill-opacity=".95" stroke="none"/>
      <rect x="798.22" y="609.46" width="3.55" height="11.54" rx="1.78" fill="#EEF2ED" fill-opacity=".85" stroke="none"/>
    </g>
  </g>
  
  <!-- marcas de registro -->
  <g fill="none" stroke="#A9C6B8" stroke-width="1" stroke-opacity=".3"><path d="M52 76V52H76"/><circle cx="52" cy="52" r="1.7" fill="#A9C6B8" stroke="none" fill-opacity=".45"/><path d="M1548 76V52H1524"/><circle cx="1548" cy="52" r="1.7" fill="#A9C6B8" stroke="none" fill-opacity=".45"/><path d="M52 1124V1148H76"/><circle cx="52" cy="1148" r="1.7" fill="#A9C6B8" stroke="none" fill-opacity=".45"/><path d="M1548 1124V1148H1524"/><circle cx="1548" cy="1148" r="1.7" fill="#A9C6B8" stroke="none" fill-opacity=".45"/></g>
  <g stroke="#A9C6B8" stroke-width="1" stroke-opacity=".18">
    <path d="M800 40v14M800 1146v14M40 600h14M1546 600h14"/>
    <path d="M52 400h8M52 800h8M1540 400h8M1540 800h8M400 52v8M1200 52v8M400 1148v8M1200 1148v8"/>
  </g>
  <g stroke="#A9C6B8" stroke-width="1" stroke-opacity=".1">
    <path d="M148 96h32M1420 96h32M148 1104h32M1420 1104h32"/>
  </g>
  <!-- firma: Vínculo 24 px -->
  <g transform="translate(1498 1094) scale(0.09375)" opacity=".35">
    <circle cx="128" cy="128" r="88" fill="none" stroke="#A9C6B8" stroke-width="26"
            stroke-dasharray="414 139" transform="rotate(-45 128 128)"/>
    <circle cx="140" cy="140" r="48" fill="none" stroke="#5E8F7B" stroke-width="26"
            stroke-dasharray="226 76" transform="rotate(135 140 140)"/>
    <circle cx="102" cy="102" r="14" fill="#A9C6B8"/>
    <circle cx="226" cy="226" r="12" fill="#A9C6B8"/>
  </g>
</svg>
