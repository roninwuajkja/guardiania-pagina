<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="p-title">
  <title id="p-title">IA Guardian — panel del tutor</title>
  <defs>
    <radialGradient id="p-bg" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#0B241E"/>
      <stop offset="1" stop-color="#081B17"/>
    </radialGradient>
    <radialGradient id="p-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5E8F7B" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#5E8F7B" stop-opacity=".06"/>
      <stop offset="1" stop-color="#5E8F7B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#A9C6B8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p-glow-soft" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#A9C6B8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p-vignette" cx="50%" cy="48%" r="72%">
      <stop offset=".52" stop-color="#081B17" stop-opacity="0"/>
      <stop offset="1" stop-color="#081B17" stop-opacity=".62"/>
    </radialGradient>
    <pattern id="p-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A9C6B8" stroke-width="1" opacity=".05"/>
    </pattern>
    <pattern id="p-grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#A9C6B8" stroke-width="1" opacity=".055"/>
    </pattern>
    <pattern id="p-dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="1.3" fill="#A9C6B8" opacity=".22"/>
    </pattern>
    <linearGradient id="p-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123029"/>
      <stop offset="1" stop-color="#0B241E"/>
    </linearGradient>
    <linearGradient id="p-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2ED" stop-opacity=".06"/>
      <stop offset=".45" stop-color="#EEF2ED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123029" stop-opacity=".5"/>
      <stop offset="1" stop-color="#081B17" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="p-fade-x" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A9C6B8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </linearGradient>
    <filter id="p-shadow" x="-45%" y="-45%" width="190%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="p-shadow-lite" x="-45%" y="-45%" width="190%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    
    <clipPath id="p-clip-plate"><path d="M500 690H1100L1180 1020H420Z"/></clipPath>
    <linearGradient id="p-fade-y" gradientUnits="userSpaceOnUse" x1="0" y1="660" x2="0" y2="1035">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".72" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="p-floor-mask"><rect x="0" y="660" width="1600" height="380" fill="url(#p-fade-y)"/></mask>
    <linearGradient id="p-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9C6B8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A9C6B8" stop-opacity="0"/>
    </linearGradient>
  </defs>

